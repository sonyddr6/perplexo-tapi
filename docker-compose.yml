# ==============================
# Perplexo Bot - Docker Compose
# ==============================
# Com VPN NordVPN integrada

services:
  # ========== VPN Container (Gluetun + NordVPN) ==========
  vpn:
    image: qmcgaw/gluetun
    container_name: perplexo-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # NordVPN Config
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPUN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      # Servidor Brasil
      - SERVER_COUNTRIES=Brazil
    ports:
      - "5000:5000"
      - "8001:8000"
    volumes:
      - ./gluetun:/gluetun
    restart: unless-stopped
    networks:
      - perplexo-net
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://ipinfo.io" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 35s

  # ========== Python: MCP Server + Telegram Bot ==========
  perplexo-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perplexo-bot
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - PERPLEXITY_SESSION_TOKEN=${PERPLEXITY_SESSION_TOKEN}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - MCP_PORT=5000
      - TELEGRAM_PORT=8000
      - MCP_API_URL=http://127.0.0.1:5000
      - FLASK_ENV=production
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./auth_info_baileys:/app/auth_info_baileys

  # ========== Node.js: WhatsApp Bot (opcional) ==========
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    container_name: perplexo-whatsapp
    restart: unless-stopped
    environment:
      - MCP_API_URL=http://perplexo-vpn:5000
    volumes:
      - ./auth_info_baileys:/app/auth_info_baileys
    depends_on:
      - perplexo-bot
    networks:
      - perplexo-net
    profiles:
      - whatsapp

networks:
  perplexo-net:
    driver: bridge
